<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>MS Hwy 182 - Field Quantities Tool</title>

<!-- PWA / Add-to-Home-Screen wiring -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3E4D3E">

<!-- iOS home screen icon + standalone app behavior -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BD Hwy182">

<!-- browser tab icon -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="shortcut icon" href="icons/favicon.ico">

<style>
  :root{
    /* Burns Dirt brand palette */
    --ink:#3E4D3E;        /* Burns Green — primary, headers, active states */
    --ink-soft:#363636;   /* Burns Midnight — secondary text */
    --blueprint:#EEEEEA;  /* warm Ash-tinted page background */
    --blueprint-line:#D6D6D6; /* Burns Ash — grid lines */
    --paper:#FBFAF8;      /* warm off-white card background */
    --yellow:#F26722;     /* Burns Orange — accent / CTA (kept var name for minimal diff) */
    --yellow-deep:#CC5116; /* darkened Burns Orange for pressed states */
    --concrete:#7A7367;   /* Sand-adjacent warm gray — labels/muted text */
    --good:#3E4D3E;       /* Burns Green — success/confirmation */
    --warn:#B4491F;       /* rust — warnings (kept distinct from Orange accent) */
    --line:#DEDEDA;       /* warm Ash border */
    --sand:#B9AB99;       /* Burns Sand */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--blueprint-line) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--blueprint-line) 1px, transparent 1px) 0 0/28px 28px,
      var(--blueprint);
    color:var(--ink);
    font-family: "Linux Libertine", Georgia, ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    padding-bottom:84px;
  }
  .mono{font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums;}
  /* Boldfinger reserved for the single page title only — its Impact fallback is too
     condensed to stay legible on buttons, labels, and result numbers in a field tool. */
  h1,h2,h3,nav.tabbar button,.subtab,.save-btn,.value,.label{
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  header{
    background:var(--ink);
    color:var(--paper);
    padding:14px 18px;
    position:sticky; top:0; z-index:20;
    box-shadow:0 2px 10px rgba(62,77,62,.3);
    display:flex; align-items:center; justify-content:center; gap:12px; text-align:center;
  }
  header .brand-text{display:flex; flex-direction:column; align-items:center;}
  header img.brand-icon{
    height:44px; width:auto; flex-shrink:0;
  }
  header .eyebrow{
    font-size:11px; letter-spacing:.04em; color:var(--yellow); font-weight:700;
  }
  header h1{
    margin:2px 0 0; font-size:19px; font-weight:800; letter-spacing:-.01em;
  }

  main{max-width:560px; margin:0 auto; padding:16px;}

  .subtabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .subtab{
    flex:1 1 auto; text-align:center;
    background:var(--paper); border:1.5px solid var(--line);
    color:var(--ink-soft); font-weight:700; font-size:13px;
    padding:10px 8px; border-radius:8px; cursor:pointer;
    min-width:90px;
  }
  .subtab.active{
    background:var(--ink); color:var(--yellow); border-color:var(--ink);
  }

  .card{
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:18px;
    margin-bottom:16px;
  }
  .card h2{
    font-size:15px; margin:0 0 4px; font-weight:800;
  }
  .card .sub{font-size:12.5px; color:var(--concrete); margin:0 0 16px;}

  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select{
    width:100%; font-size:16px; padding:12px 12px;
    border:1.5px solid var(--line); border-radius:8px;
    background:#fff; color:var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .field select{font-family: inherit;}
  .row2{display:flex; gap:10px;}
  .row2 > .field{flex:1;}

  .gaplist{margin:8px 0 4px;}
  .gaprow{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .gaprow input{flex:1;}
  .gaprow button{
    background:none; border:1.5px solid var(--warn); color:var(--warn);
    border-radius:6px; width:36px; height:40px; font-size:16px; cursor:pointer;
  }
  .addgap{
    background:none; border:1.5px dashed var(--concrete); color:var(--concrete);
    border-radius:8px; padding:8px 12px; font-size:13px; font-weight:700;
    cursor:pointer; width:100%;
  }

  .result{
    margin-top:6px;
    background:var(--ink); color:var(--paper);
    border-radius:10px; padding:16px 18px;
    display:flex; align-items:baseline; justify-content:space-between;
    flex-wrap:wrap; gap:6px;
  }
  .result .label{font-size:12px; color:#C7CFC5; font-weight:700;}
  .result .value{font-size:28px; font-weight:800; color:var(--yellow);}
  .result .unit{font-size:14px; color:var(--yellow); font-weight:700; margin-left:4px;}
  .result.warn{background:var(--warn);}
  .result.warn .value, .result.warn .unit{color:#FFE6D8;}

  .note{
    font-size:12px; color:var(--ink-soft); background:#fff;
    border-left:3px solid var(--yellow-deep); padding:8px 10px; border-radius:4px;
    margin-top:10px; line-height:1.45;
  }
  .fallback-warning{
    font-size:12.5px; color:#fff; background:var(--warn);
    border-left:3px solid #7A2E12; padding:10px 12px; border-radius:6px;
    margin-top:10px; line-height:1.5; font-weight:600;
  }
  .fallback-warning strong{font-weight:800;}

  .save-btn{
    margin-top:14px; width:100%; padding:14px;
    background:var(--yellow); color:var(--ink);
    border:none; border-radius:8px; font-weight:800; font-size:15px;
    cursor:pointer;
  }
  .save-btn:active{background:var(--yellow-deep);}
  .save-btn:disabled{background:#E3E1DC; color:#A39D8F; cursor:not-allowed;}

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--good); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13px; font-weight:700; opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:30;
  }
  .toast.show{opacity:1;}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--ink); display:flex;
    box-shadow:0 -2px 10px rgba(62,77,62,.3); z-index:20;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:#96A092;
    padding:11px 4px 9px; font-size:11.5px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer;
  }
  nav.tabbar button .ic{font-size:18px;}
  nav.tabbar button.active{color:var(--yellow);}

  .logentry{
    background:var(--paper); border:1.5px solid var(--line); border-radius:8px;
    padding:12px 14px; margin-bottom:10px;
  }
  .logentry .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .logentry .type{font-size:11px; font-weight:800; color:var(--ink-soft); letter-spacing:.02em;}
  .logentry .detail{font-size:12.5px; color:var(--concrete); margin-top:2px;}
  .logentry .qty{font-size:17px; font-weight:800; color:var(--ink); white-space:nowrap;}
  .logentry .del{
    background:none; border:none; color:var(--warn); font-size:11px; font-weight:700;
    cursor:pointer; padding:4px 0; margin-top:6px;
  }

  .totals{
    background:var(--ink); color:var(--paper); border-radius:10px;
    padding:14px 16px; margin-bottom:16px;
  }
  .totals h2{font-size:13px; margin:0 0 10px; color:var(--yellow);}
  .totrow{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0;
    border-bottom:1px solid rgba(255,255,255,.1);}
  .totrow:last-child{border-bottom:none;}
  .totrow .n{color:#C7CFC5;}
  .totrow .v{font-weight:800; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;}

  .toprow{display:flex; gap:10px; margin-bottom:14px;}
  .toprow button{
    flex:1; padding:11px; border-radius:8px; font-weight:700; font-size:13px;
    cursor:pointer; border:1.5px solid var(--line); background:#fff; color:var(--ink-soft);
  }
  .toprow button.primary{background:var(--ink); color:var(--yellow); border-color:var(--ink);}

  .empty{text-align:center; color:var(--concrete); font-size:13px; padding:30px 10px;}
</style>
</head>

function findEq1Driveway(rawSta){
  const target = staToFt(rawSta);
  if(target === null) return null;
  // exact match within 0.5 ft tolerance (handles rounding in how station was typed)
  return EQ1.driveways.find(d => Math.abs(staToFt(d.station) - target) < 0.5) || null;
}
function findEq1RangeSegment(list, rawSta){
  const target = staToFt(rawSta);
  if(target === null) return null;
  return list.find(seg => {
    const from = staToFt(seg.from), to = staToFt(seg.to);
    return from !== null && to !== null && target >= from && target <= to;
  }) || null;
}

function normStructId(rawId){
  if(!rawId) return null;
  let id = String(rawId).trim().toUpperCase().replace(/\s+/g,'');
  if(id && !id.startsWith('D')) id = 'D' + id;
  return id || null;
}
function findPipeSegment(idA, idB){
  const a = normStructId(idA), b = normStructId(idB);
  if(!a || !b) return null;
  return PIPE_SEGMENTS.find(seg =>
    (seg.from === a && seg.to === b) || (seg.from === b && seg.to === a)
  ) || null;
}

    return from !== null && to !== null && target >= from && target <= to;
  }) || null;
}

function findStructure(rawId){
  if(!rawId) return null;
  let id = rawId.trim().toUpperCase().replace(/\s+/g,'');
  if(id && !id.startsWith('D')) id = 'D' + id;
  return STRUCTURES[id] || null;
}
// ---------- Reference tables ----------
const HP_TRENCH_TABLE = { // nominal in -> min trench width ft (DPD-1 Table 1)
  12: 30/12, 15: 34/12, 18: 39/12, 24: 48/12, 30: 56/12, 36: 64/12, 42: 72/12, 48: 80/12, 60: 96/12
};
// RCP trench width — per the PE (2026-09-04): trench width = pipe OD + 12" on each side
// (OD + 2.0 ft total); trench length = total running length of the trench, no separate
// end-of-pipe allowance. OD is computed from nominal (inside) diameter using the standard
// ASTM C76 Wall B thickness formula, t = D/12 + 1 (inches) — this matches the wall
// thicknesses shown for 54"/60" pipe in the project's own Section 708 pipe table, so the
// same formula is used across all sizes on this project (12"-60").
// NOTE: this replaced an earlier nominal-diameter + 1.0 ft formula reverse-engineered from
// EQ-7/EQ-8 quantities, which came in 1.3-2.0 ft narrower than this PE-confirmed width at
// every size — any RCP entries logged before 2026-09-04 were computed under that narrower
// formula and should be reviewed.
function rcpTrenchWidthFt(diaIn){
  const wallIn = (diaIn/12) + 1;       // ASTM C76 Wall B thickness, inches
  const odIn = diaIn + 2*wallIn;       // outside diameter, inches
  return (odIn/12) + 2;                // OD (ft) + 12" each side
}
// Returns {width, isFallback, nearestSize} instead of silently substituting.
// The caller is responsible for surfacing isFallback to the user — this
// table only covers the sizes on MDOT DPD-1 Table 1 (12,15,18,24,30,36,42,48,60).
function hpTrenchWidthFt(diaIn){
  if(HP_TRENCH_TABLE[diaIn] !== undefined){
    return { width: HP_TRENCH_TABLE[diaIn], isFallback: false, nearestSize: diaIn };
  }
  const sizes = Object.keys(HP_TRENCH_TABLE).map(Number).sort((a,b)=>a-b);
  const nearest = sizes.reduce((p,c)=> Math.abs(c-diaIn)<Math.abs(p-diaIn)?c:p);
  return { width: HP_TRENCH_TABLE[nearest], isFallback: true, nearestSize: nearest };
}

// ---------- Station helper ----------
function staToFt(s){
  // accepts "68+20", "68+20.5", or plain feet number
  if(s === null || s === undefined || s === '') return null;
  s = String(s).trim();
  if(s.includes('+')){
    const [a,b] = s.split('+');
    const whole = parseFloat(a);
    const dec = parseFloat(b);
    if(isNaN(whole) || isNaN(dec)) return null;
    return whole*100 + dec;
  }
  const v = parseFloat(s);
  return isNaN(v) ? null : v;
}

const STORE_KEY = 'entries';

let storageReady = false;

const LS_KEY = 'hwy182_' + STORE_KEY; // namespaced localStorage key — data lives on this device only
async function loadEntries(){
  try{
    const raw = window.localStorage.getItem(LS_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){
    entries = [];
  }
  storageReady = true;
  renderLog();
}
async function persist(){
  try{
    window.localStorage.setItem(LS_KEY, JSON.stringify(entries));
  }catch(e){ console.error('storage failed', e); }
}
function addEntry(entry){
  entry.id = Date.now() + '-' + Math.random().toString(36).slice(2,7);
  entry.date = new Date().toISOString().slice(0,10);
  entries.unshift(entry);
  persist();
  renderLog();
  showToast();
}
function deleteEntry(id){
  entries = entries.filter(e=>e.id!==id);
  persist();
  renderLog();
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg || 'Saved to log';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}

// --- Asphalt/Concrete ---
function wireAsphalt(){
  const ids = ['a_begin','a_end','a_width'];
  ids.forEach(id=> document.getElementById(id).addEventListener('input', calcAsphalt));
  document.getElementById('a_save').addEventListener('click', saveAsphalt);
  calcAsphalt();
}
let asphaltState = null;
function calcAsphalt(){
  const begin = staToFt(document.getElementById('a_begin').value);
  const end = staToFt(document.getElementById('a_end').value);
  const width = parseFloat(document.getElementById('a_width').value);
  const resDiv = document.getElementById('a_result');
  const saveBtn = document.getElementById('a_save');

  if(begin===null || end===null || isNaN(width) || width<=0 || end<=begin){
    resDiv.innerHTML = '';
    saveBtn.disabled = true;
    asphaltState = null;
    return;
  }
  const length = end - begin;
  const sy = (length * width) / 9;
  resDiv.innerHTML = `
    <div class="result">
      <div>
        <div class="label">${length.toFixed(1)} LF × ${width} FT</div>
      </div>
      <div><span class="value">${sy.toFixed(1)}</span><span class="unit">SY</span></div>
    </div>
    <div class="note">Logs once each under 202-B007 Asphalt Removal and 202-B069 Concrete w/ Overlay Removal — same footprint, same ${sy.toFixed(1)} SY.</div>`;
  asphaltState = {detail:`Sta ${document.getElementById('a_begin').value}–${document.getElementById('a_end').value}, ${width}' wide`, qty:sy, unit:'SY'};
  saveBtn.disabled = false;
}
function saveAsphalt(){
  if(!asphaltState) return;
  addEntry({...asphaltState, item:'202-B007 Asphalt Removal'});
  addEntry({...asphaltState, item:'202-B069 Concrete w/ Overlay Removal'});
}

// --- Structure lookup ---
let nsOffsetBegin = null; // {mag, side} captured from the last "Use as Begin Sta" click
let nsOffsetEnd = null;   // {mag, side} captured from the last "Use as End Sta" click

function parseOffset(offsetStr){
  if(!offsetStr) return null;
  const m = String(offsetStr).trim().match(/(-?[\d.]+)\s*(LT|RT)?/i);
  if(!m) return null;
  const raw = parseFloat(m[1]);
  if(isNaN(raw)) return null;
  const side = (m[2] || '').toUpperCase() || (raw < 0 ? 'LT' : 'RT');
  return { mag: Math.abs(raw), side };
}

function maybeApplyNSEstimate(){
  const cb = document.getElementById('p_ns');
  const status = document.getElementById('p_ns_status');
  if(!cb || !status) return;
  if(!cb.checked){ status.style.display = 'none'; return; }
  if(!nsOffsetBegin || !nsOffsetEnd){
    status.style.display = 'block';
    status.innerHTML = 'Look up the begin structure and tap "Use as Begin Sta", then look up the end structure and tap "Use as End Sta" — need both offsets to estimate.';
    return;
  }
  const crossesCenterline = nsOffsetBegin.side !== nsOffsetEnd.side;
  const est = crossesCenterline
    ? nsOffsetBegin.mag + nsOffsetEnd.mag
    : Math.abs(nsOffsetBegin.mag - nsOffsetEnd.mag);
  const lfInput = document.getElementById('p_lf_override');
  lfInput.value = est.toFixed(1);
  status.style.display = 'block';
  status.innerHTML = `Estimated <strong>${est.toFixed(1)} LF</strong> from offsets ${nsOffsetBegin.mag.toFixed(2)}' ${nsOffsetBegin.side} + ${nsOffsetEnd.mag.toFixed(2)}' ${nsOffsetEnd.side}${crossesCenterline ? ' (crosses centerline)' : ' (same side — using difference)'}. Filled into LF Override — verify against the DRN sheet before logging.`;
  calcPipe();
}

function wireStructureLookup(){
  const input = document.getElementById('s_lookup');
  if(!input) return;
  input.addEventListener('input', renderStructureLookup);
  const nsBox = document.getElementById('p_ns');

  renderStructureLookup();
}
let lastBeginStructId = null;
let lastEndStructId = null;
function useDesignSegment(){

      <div class="mono" style="font-size:12.5px; color:var(--ink-soft);">
        Design Structure Excavation: <strong>${seg.cy.toFixed(1)} CY</strong> · Design Depth: <strong>${seg.depth.toFixed(2)} ft</strong>
      </div>
      <p style="font-size:12px; color:var(--concrete); margin:6px 0 0; line-height:1.4;">
        This is the engineer's documented plan quantity for this exact segment — more reliable than a geometric
        estimate, but still a <strong>design</strong> number, not a field measurement. Use the inspector's/as-built
        value instead if you have one.
      </p>

    </div>`;

function fillFromStructure(sightingIdx, target){
  // Re-run the lookup to get the current sighting (avoids stale closures across re-renders)
  const rawId = document.getElementById('s_lookup').value;
  const sightings = findStructure(rawId);
  if(!sightings || !sightings[sightingIdx]) return;
  const s = sightings[sightingIdx];
  const el = document.getElementById(target === 'begin' ? 'p_begin' : 'p_end');
  if(el && s.station) el.value = s.station;
  const parsed = parseOffset(s.offset);
  const normId = normStructId(rawId);
  if(target === 'begin'){ nsOffsetBegin = parsed; lastBeginStructId = normId; }
  else { nsOffsetEnd = parsed; lastEndStructId = normId; }
  renderDesignBox();
  maybeApplyNSEstimate();
  calcPipe();
}
function renderStructureLookup(){
  const resDiv = document.getElementById('s_result');
  if(!resDiv) return;
  const rawId = document.getElementById('s_lookup').value;
  if(!rawId || !rawId.trim()){ resDiv.innerHTML = ''; return; }
  const sightings = findStructure(rawId);
  if(!sightings){
    resDiv.innerHTML = `<div class="note">No match for "${rawId}" in the DRN-3L/R–DRN-12L/R database (Sta 20+00 to end). Check the ID or the plan sheets directly.</div>`;
    return;
  }
  const hasConflict = sightings.length > 1 &&
    new Set(sightings.map(s=>s.rim)).size > 1;
  let html = '';
  sightings.forEach((s, i)=>{
    const invIn = s.invert_in && s.invert_in.length
      ? s.invert_in.map(([elev,from])=> `${elev!==null?elev.toFixed(2):'?'} (${from})`).join(', ')
      : '—';
    const typeLine = s.eq_type ? `${s.eq_type}${s.eq_drawing?' · Std. Dwg '+s.eq_drawing:''}` : null;
    html += `
      <div class="result" style="background:#fff; color:var(--ink); border:1.5px solid var(--line); margin-top:${i>0?'10px':'6px'};">
        <div style="width:100%;">
          <div class="label" style="color:var(--concrete);">${s.sheet}${sightings.length>1?` (reading ${i+1} of ${sightings.length})`:''}</div>
          <div class="mono" style="font-size:14px; margin:4px 0 8px; color:var(--ink);">
            Sta ${s.station||'—'}, ${s.offset||'—'} &nbsp;·&nbsp; Rim ${s.rim!==null&&s.rim!==undefined?s.rim.toFixed(2):'—'}
          </div>
          ${typeLine?`<div style="font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;">${typeLine}</div>`:''}
          <div class="mono" style="font-size:12.5px; color:var(--ink-soft);">
            Inv In: ${invIn}<br>
            Inv Out: ${s.invert_out!==null&&s.invert_out!==undefined?s.invert_out.toFixed(2):'—'} ${s.invert_out_to?'→ '+s.invert_out_to:''}
          </div>
          ${s.eq_remarks?`<div class="note" style="margin-top:8px;">${s.eq_remarks} <span style="color:var(--concrete);">(per EQ-5/EQ-6)</span></div>`:''}
          ${s.note?`<div class="fallback-warning" style="margin-top:8px;">⚠ ${s.note}</div>`:''}
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button type="button" class="save-btn" style="margin-top:0; padding:9px; font-size:12.5px;" onclick="fillFromStructure(${i},'begin')">Use as Begin Sta</button>
            <button type="button" class="save-btn" style="margin-top:0; padding:9px; font-size:12.5px; background:#fff; border:1.5px solid var(--ink); color:var(--ink);" onclick="fillFromStructure(${i},'end')">Use as End Sta</button>
          </div>
        </div>
      </div>`;
  });
  if(hasConflict){
    html += `<div class="fallback-warning" style="margin-top:10px;">⚠ <strong>Rim elevation conflicts between sheets for this structure.</strong> Confirm against the actual plan sheet before using for pay quantities.</div>`;
  }
  resDiv.innerHTML = html;
}

function saveGeotextile(){
  if(!geoState) return;
  addEntry(geoState);
}

// --- Base: Crushed Stone ---
function wireCrushedStone(){
  ['cs_condition','cs_begin','cs_end','cs_width','cs_density'].forEach(id=>{
    document.getElementById(id).addEventListener('input', calcCrushedStone);
    document.getElementById(id).addEventListener('change', calcCrushedStone);
  });
  document.getElementById('cs_save').addEventListener('click', saveCrushedStone);
  calcCrushedStone();
}
let stoneState = null;
function calcCrushedStone(){
  const condition = document.getElementById('cs_condition').value;
  const begin = staToFt(document.getElementById('cs_begin').value);
  const end = staToFt(document.getElementById('cs_end').value);
  const width = parseFloat(document.getElementById('cs_width').value);
  const density = parseFloat(document.getElementById('cs_density').value); // tons per CY
  const resDiv = document.getElementById('cs_result');
  const saveBtn = document.getElementById('cs_save');
  const tonsDiv = document.getElementById('cs_tons_result');

  stoneState = null;

  if(begin===null || end===null || isNaN(width) || width<=0 || end<=begin){
    resDiv.innerHTML = '';
    tonsDiv.style.display = 'none'; tonsDiv.innerHTML = '';
    saveBtn.disabled = true;
    return;
  }
  const length = end - begin;
  const sy = (length * width) / 9;
  const thicknessIn = condition === '12in' ? 12 : 6;
  const thicknessLabel = condition === '12in' ? '12.0"' : '6.0"';

  resDiv.innerHTML = `
    <div class="result">
      <div><div class="label">${length.toFixed(1)} LF × ${width} FT · ${thicknessLabel} base</div></div>
      <div><span class="value">${sy.toFixed(1)}</span><span class="unit">SY</span></div>
    </div>`;

  if(!isNaN(density) && density > 0){
    const cy = sy * (thicknessIn / 36); // CY = SY × thickness(ft) / 3 = SY × thickness(in) / 36
    const tons = cy * density;
    tonsDiv.style.display = 'block';
    tonsDiv.innerHTML = `
      <div class="result" style="background:var(--ink);">
        <div><div class="label">${cy.toFixed(1)} CY × ${density} tons/CY</div></div>
        <div><span class="value">${tons.toFixed(1)}</span><span class="unit">TONS (est.)</span></div>
      </div>`;
    stoneState = {item:'304-F003 Crushed Stone Base', detail:`Sta ${document.getElementById('cs_begin').value}–${document.getElementById('cs_end').value}, ${width}' wide, ${thicknessLabel} depth`, qty:tons, unit:'TONS'};
    saveBtn.disabled = false;
  } else {
    tonsDiv.style.display = 'none';
    tonsDiv.innerHTML = '';
    saveBtn.disabled = true;
  }
}
function saveCrushedStone(){
  if(!stoneState) return;
  addEntry(stoneState);
}

// --- Pipe ---
function wirePipe(){
  ['p_begin','p_end','p_lf_override','p_material','p_size','p_depth','p_dual'].forEach(id=>{
    document.getElementById(id).addEventListener('input', calcPipe);
    document.getElementById(id).addEventListener('change', calcPipe);
  });
  document.getElementById('p_save').addEventListener('click', savePipe);
  wireStructureLookup();
  calcPipe();
}
let pipeState = null;
function calcPipe(){
  const begin = staToFt(document.getElementById('p_begin').value);
  const end = staToFt(document.getElementById('p_end').value);
  const lfOverride = parseFloat(document.getElementById('p_lf_override').value);
  const material = document.getElementById('p_material').value;
  const size = parseInt(document.getElementById('p_size').value, 10);
  const depth = parseFloat(document.getElementById('p_depth').value);
  const dual = document.getElementById('p_dual').value === 'yes';
  const resDiv = document.getElementById('p_result');
  const saveBtn = document.getElementById('p_save');

  let lf;
  let lengthSource;
  if(!isNaN(lfOverride) && lfOverride > 0){
    lf = lfOverride;
    lengthSource = 'manual LF override';
  } else if(begin!==null && end!==null && end>begin){
    lf = end - begin;
    lengthSource = 'station delta';
  } else {
    resDiv.innerHTML = ''; saveBtn.disabled = true; pipeState = null; return;
  }
  if(isNaN(depth) || depth<=0){
    resDiv.innerHTML = ''; saveBtn.disabled = true; pipeState = null; return;
  }

  const effectiveSize = dual ? size*2 : size; // "dual lay paid as 1 run of Nx pipe" per user's stated convention — trench width driven by the paid equivalent size

  let trenchW, fallbackWarningHTML = '';
  if(material === 'RCP'){
    trenchW = rcpTrenchWidthFt(effectiveSize);
  } else {
    const hp = hpTrenchWidthFt(effectiveSize);
    trenchW = hp.width;
    if(hp.isFallback){
      fallbackWarningHTML = `
        <div class="fallback-warning">
          ⚠ <strong>${effectiveSize}" is not on MDOT DPD-1 Table 1.</strong>
          Table only covers 12, 15, 18, 24, 30, 36, 42, 48, 60". Using the
          <strong>${hp.nearestSize}" width (${hp.width.toFixed(2)} ft)</strong> as a placeholder —
          this is <strong>not</strong> a verified value for ${effectiveSize}" pipe.
          Confirm the correct trench width before submitting this quantity.
        </div>`;
      saveBtn.disabled = true;
    }
  }

  const structCY = (lf * trenchW * depth) / 27;
  const pipeLF = dual ? lf*2 : lf;

  resDiv.innerHTML = `
    <div class="result">
      <div><div class="label">${lf.toFixed(1)} LF trench (${lengthSource}) · width ${trenchW.toFixed(2)} FT</div></div>
      <div><span class="value">${structCY.toFixed(1)}</span><span class="unit">CY</span></div>
    </div>
    ${fallbackWarningHTML}
    <div class="note">
      Pipe furnish &amp; install: <strong>${pipeLF.toFixed(1)} LF</strong> of ${size}" ${material}${dual ? ' (dual lay, 2 runs)':''}.<br>
      Trench width source: ${material==='RCP' ? 'pipe OD + 1 ft each side, per PE (2026-09-04) — OD from ASTM C76 Wall B thickness' : 'MDOT DPD-1 Table 1'}${dual ? `, using ${effectiveSize}" equivalent per dual-lay convention` : ''}.
    </div>
  `;
  pipeState = [
    {item:`603-ALT ${size}" ${material} Pipe Install`, detail:`Sta ${document.getElementById('p_begin').value||'—'}–${document.getElementById('p_end').value||'—'}${dual?' (dual lay)':''}`, qty:pipeLF, unit:'LF'},
    {item:'206-A001 Structure Excavation', detail:`${size}" ${material}, ${depth}' deep${dual?', dual lay (paid as '+effectiveSize+'")':''}`, qty:structCY, unit:'CY'}
  ];
  if(!fallbackWarningHTML) saveBtn.disabled = false;
}
function savePipe(){
  if(!pipeState) return;
  pipeState.forEach(e=> addEntry({...e}));
}
